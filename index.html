<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comercial Faro Sur · Catálogo de Productos</title>
  <meta name="description" content="Tienda de variedades con productos importados de China: hogar, tecnología, belleza, juguetes, regalos y mucho más. Comercial Faro Sur.">
  <meta name="theme-color" content="#0F2E3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230F2E3E'/%3E%3Cpath d='M24 16 8 10v6l16 6z' fill='%23E9A13B'/%3E%3Cpath d='M24 16l16-6v6l-16 6z' fill='%23E9A13B' opacity='.6'/%3E%3Cpath d='M20 18h8l3 18H17z' fill='%23fff'/%3E%3Cpath d='M18 39h12v3H18z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
/* ============================================================
   COMERCIAL FARO SUR · Estilos
   Los colores y el redondeo se controlan desde config.js / editor.
   ============================================================ */

:root {
  --primary: #0f2e3e;
  --accent: #e9a13b;
  --hot: #c62828;
  --bg: #f4f6f7;
  --radius: 18px;
  --font: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --text: #17272f;
  --muted: #61737d;
  --line: #e2e8ec;
  --card: #ffffff;
  --shadow-sm: 0 2px 8px rgba(15, 46, 62, 0.05);
  --shadow-md: 0 14px 34px rgba(15, 46, 62, 0.1);
  --container: 1240px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

body.no-sticky .site-header { position: static; }
body.no-shadow .cat-card,
body.no-shadow .product-card,
body.no-shadow .promo,
body.no-shadow .popular { box-shadow: none !important; }

img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }

.container {
  width: min(var(--container), 100% - 40px);
  margin-inline: auto;
}

section[id], footer[id] { scroll-margin-top: 130px; }

/* ---------- Iconos ---------- */
.ico { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -2px; }
.ico-sm { width: 14px; height: 14px; }

/* ---------- Barra superior ---------- */
.topbar {
  background: var(--primary);
  color: #fff;
  font-size: 12.5px;
  letter-spacing: 0.01em;
}
.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 38px;
}
.topbar-msg {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  opacity: 0.92;
}
.topbar-right {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  white-space: nowrap;
  opacity: 0.88;
}
.topbar-right a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.topbar-right a:hover { color: var(--accent); }
.topbar-sep { width: 1px; height: 12px; background: rgba(255, 255, 255, 0.28); }

/* ---------- Encabezado ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 16px 0;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  flex: none;
}
.brand-mark {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--primary);
  display: grid;
  place-items: center;
  overflow: hidden;
  flex: none;
  box-shadow: inset 0 -12px 22px rgba(0, 0, 0, 0.18);
}
.brand-mark svg { width: 34px; height: 34px; }
.brand-mark-img img { width: 100%; height: 100%; object-fit: cover; }
.brand-emoji { font-size: 26px; line-height: 1; }
.brand-text { display: flex; flex-direction: column; line-height: 1.12; }
.brand-kicker {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
}
.brand-name {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--primary);
  white-space: nowrap;
}

.searchbar {
  display: flex;
  align-items: center;
  flex: 1;
  max-width: 660px;
  margin-inline: auto;
  padding: 4px;
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.searchbar:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
}
.searchbar select {
  border: 0;
  outline: none;
  background: transparent;
  padding: 8px 6px 8px 14px;
  font-size: 12.5px;
  color: var(--muted);
  max-width: 158px;
  cursor: pointer;
}
.search-split { width: 1px; height: 22px; background: var(--line); flex: none; }
.searchbar input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  padding: 9px 12px;
  font-size: 14px;
}
.searchbar input::placeholder { color: #97a6ae; }
.search-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 0;
  border-radius: 999px;
  background: var(--primary);
  color: #fff;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
}
.search-btn:hover { background: color-mix(in srgb, var(--primary) 82%, #000); transform: translateY(-1px); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: none;
}
.phone-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  text-decoration: none;
  white-space: nowrap;
}
.phone-link .ico { color: var(--accent); }
.phone-link:hover { color: var(--hot); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 999px;
  padding: 11px 20px;
  font-size: 13px;
  font-weight: 650;
  border: 1.5px solid transparent;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.16s, color 0.16s, border-color 0.16s, transform 0.16s;
}
.btn:hover { transform: translateY(-1px); }
.btn-accent { background: var(--accent); color: #2b1c04; }
.btn-accent:hover { background: color-mix(in srgb, var(--accent) 86%, #000); color: #1e1302; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 85%, #000); }
.btn-ghost { background: #fff; border-color: var(--line); color: var(--primary); }
.btn-ghost:hover { border-color: var(--primary); }
.btn-wa { background: #1faf54; color: #fff; }
.btn-wa:hover { background: #179347; color: #fff; }

/* ---------- Navegación ---------- */
.main-nav { background: var(--card); border-bottom: 1px solid var(--line); }
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 48px;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-links::-webkit-scrollbar { display: none; }
.nav-link {
  position: relative;
  display: inline-block;
  padding: 14px 13px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--primary);
  text-decoration: none;
  white-space: nowrap;
  transition: color 0.15s;
}
.nav-link::after {
  content: "";
  position: absolute;
  left: 13px;
  right: 13px;
  bottom: 8px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.18s;
}
.nav-link:hover { color: var(--hot); }
.nav-link:hover::after { transform: scaleX(1); }
.nav-link.is-active::after { transform: scaleX(1); }
.nav-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  background: color-mix(in srgb, var(--accent) 22%, #fff);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, #fff);
  border-radius: 999px;
  padding: 6px 13px;
  text-decoration: none;
  white-space: nowrap;
  transition: background 0.15s;
}
.nav-badge:hover { background: color-mix(in srgb, var(--accent) 38%, #fff); }

/* ---------- Promo ---------- */
.promo {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  margin-top: 20px;
  padding: 26px 32px;
  border-radius: calc(var(--radius) + 6px);
  color: #fff;
  background:
    radial-gradient(130% 180% at 92% -10%, color-mix(in srgb, var(--accent) 55%, var(--primary)) 0%, transparent 58%),
    linear-gradient(115deg, var(--primary), color-mix(in srgb, var(--primary) 70%, #000));
  box-shadow: var(--shadow-md);
  isolation: isolate;
}
.promo::before {
  content: "";
  position: absolute;
  right: -90px;
  bottom: -120px;
  width: 330px;
  height: 330px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 20%, transparent);
  filter: blur(4px);
  z-index: -1;
}
.promo::after {
  content: "";
  position: absolute;
  right: 120px;
  top: -60px;
  width: 160px;
  height: 320px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 26%, transparent), transparent);
  transform: rotate(24deg);
  filter: blur(12px);
  z-index: -1;
}
.promo-copy { max-width: 720px; }
.promo-kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
}
.promo-kicker::before { content: ""; width: 22px; height: 2px; border-radius: 2px; background: var(--accent); }
.promo h2,
.promo-title {
  margin: 7px 0 6px;
  font-size: clamp(20px, 2.2vw, 27px);
  line-height: 1.18;
  letter-spacing: -0.02em;
  font-weight: 800;
}
.promo p { margin: 0; font-size: 13.5px; max-width: 640px; color: rgba(255, 255, 255, 0.78); }
.promo .btn { flex: none; padding: 13px 22px; font-size: 13.5px; }
.promo .btn-accent { box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22); }

/* ---------- Migas + título de página ---------- */
.breadcrumb {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding-top: 20px;
  font-size: 12px;
  color: var(--muted);
}
.breadcrumb a { text-decoration: none; color: var(--muted); }
.breadcrumb a:hover { color: var(--hot); }
.breadcrumb .sep { opacity: 0.55; }
.breadcrumb .current { color: var(--primary); font-weight: 600; }

.page-head { padding: 14px 0 6px; }
.page-title-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.page-title {
  margin: 0;
  font-size: clamp(27px, 3vw, 36px);
  line-height: 1.15;
  letter-spacing: -0.03em;
  font-weight: 800;
  color: var(--primary);
}
.page-intro {
  margin: 10px 0 0;
  max-width: 880px;
  font-size: 14px;
  color: var(--muted);
}
.page-stats { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 6px; }
.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid var(--line);
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}
.stat-pill b { color: var(--hot); }

/* ---------- Categorías ---------- */
.cats-section { padding-top: 20px; }
.cat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.cat-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 17px 18px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) - 4px);
  transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
}
.cat-card:hover {
  border-color: color-mix(in srgb, var(--accent) 65%, var(--line));
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.cat-top { display: flex; align-items: center; gap: 11px; }
.cat-icon {
  width: 42px;
  height: 42px;
  flex: none;
  display: grid;
  place-items: center;
  font-size: 22px;
  line-height: 1;
  background: var(--tint, #eef4f7);
  border-radius: 12px;
}
.cat-name {
  margin: 0;
  font-size: 15.5px;
  font-weight: 750;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--primary);
}
.cat-subs { list-style: none; margin: 0; padding: 0; flex: 1; }
.cat-subs li { line-height: 1.3; }
.cat-sub {
  border: 0;
  background: none;
  padding: 5px 0;
  font-size: 12.5px;
  line-height: 1.3;
  color: var(--muted);
  text-align: left;
  cursor: pointer;
  transition: color 0.15s;
}
.cat-sub:hover { color: var(--hot); text-decoration: underline; text-underline-offset: 3px; }
.cat-more {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 0;
  background: none;
  padding: 2px 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  cursor: pointer;
  transition: gap 0.15s, color 0.15s;
}
.cat-more:hover { gap: 9px; color: var(--hot); }
.cat-more .ico { width: 14px; height: 14px; }

/* ---------- Búsquedas populares ---------- */
.popular {
  margin-top: 30px;
  padding: 22px 24px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.section-title {
  margin: 0 0 14px;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.015em;
  color: var(--primary);
}
.chip-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px 10px;
}
.chip {
  border: 1px solid transparent;
  background: color-mix(in srgb, var(--primary) 4.5%, #fff);
  color: color-mix(in srgb, var(--primary) 80%, var(--muted));
  padding: 9px 13px;
  border-radius: 9px;
  font-size: 12.5px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip:hover {
  background: color-mix(in srgb, var(--accent) 14%, #fff);
  border-color: color-mix(in srgb, var(--accent) 40%, #fff);
  color: var(--primary);
}

/* ---------- Productos ---------- */
.products-section { padding: 38px 0 64px; }
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.section-head h2 {
  margin: 0;
  font-size: clamp(21px, 2vw, 25px);
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--primary);
}
.section-head p { margin: 5px 0 0; font-size: 13px; color: var(--muted); }
.section-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--primary);
  text-decoration: none;
  padding-bottom: 4px;
  border-bottom: 1.5px solid color-mix(in srgb, var(--accent) 70%, transparent);
  transition: color 0.15s, gap 0.15s;
}
.section-link:hover { gap: 10px; color: var(--hot); }

.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 10px 15px;
  background: color-mix(in srgb, var(--accent) 12%, #fff);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, #fff);
  border-radius: 11px;
  font-size: 12.5px;
  color: var(--primary);
}
.filter-bar b { font-weight: 800; }
.filter-clear {
  border: 0;
  background: var(--primary);
  color: #fff;
  font-size: 11.5px;
  font-weight: 650;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
}
.filter-clear:hover { background: var(--hot); }

.product-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.product-card {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) - 2px);
  overflow: hidden;
  transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
}
.product-card:hover {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  box-shadow: var(--shadow-md);
  transform: translateY(-3px);
}
.product-media {
  position: relative;
  aspect-ratio: 4 / 3;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #f3f7f9, #e6edf1);
  overflow: hidden;
}
.product-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.product-media.tone-2 { background: linear-gradient(135deg, #fdf5e7, #f6e5c4); }
.product-media.tone-3 { background: linear-gradient(135deg, #eef4fb, #dbe6f3); }
.product-media.tone-4 { background: linear-gradient(135deg, #f4eefb, #e5d8f2); }
.product-media.tone-5 { background: linear-gradient(135deg, #ecf8f0, #d3eddd); }
.product-media.tone-6 { background: linear-gradient(135deg, #fdeeee, #f4d7d7); }
.product-emoji {
  font-size: 58px;
  line-height: 1;
  filter: drop-shadow(0 12px 16px rgba(15, 46, 62, 0.16));
  transition: transform 0.25s ease;
}
.product-card:hover .product-emoji { transform: scale(1.09) rotate(-3deg); }
.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 2;
  padding: 4px 9px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
  background: var(--hot);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.16);
}
.badge.is-new { background: #157347; }
.badge.is-top { background: var(--primary); }
.badge.is-offer { background: var(--hot); }

.product-body { display: flex; flex-direction: column; flex: 1; padding: 13px 14px 14px; }
.product-cat {
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.product-name {
  margin: 0 0 10px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 39px;
}
.product-price-row {
  display: flex;
  align-items: baseline;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: auto;
}
.product-price {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--primary);
  line-height: 1.2;
}
.product-old {
  font-size: 12px;
  color: var(--muted);
  text-decoration: line-through;
}
.product-unit { font-size: 10.5px; color: var(--muted); }
.product-min { margin-top: 4px; font-size: 11px; color: var(--muted); }
.product-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-top: 12px;
  padding: 9px 12px;
  border: 1.5px solid color-mix(in srgb, var(--primary) 22%, #fff);
  border-radius: 9px;
  background: #fff;
  color: var(--primary);
  font-size: 12px;
  font-weight: 650;
  text-decoration: none;
  transition: background 0.16s, color 0.16s, border-color 0.16s;
}
.product-btn:hover { background: var(--primary); border-color: var(--primary); color: #fff; }
.product-btn .ico { width: 15px; height: 15px; }

.price-note {
  margin: 16px 2px 0;
  font-size: 11.5px;
  color: var(--muted);
}

.empty-state {
  padding: 54px 20px;
  text-align: center;
  background: #fff;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}
.empty-state .big { font-size: 42px; }
.empty-state h3 { margin: 12px 0 4px; font-size: 17px; color: var(--primary); }
.empty-state p { margin: 0 0 16px; font-size: 13px; color: var(--muted); }

/* ---------- Pie de página ---------- */
.site-footer {
  background: color-mix(in srgb, var(--primary) 90%, #000);
  color: #fff;
  padding-top: 46px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1.25fr;
  gap: 38px;
  padding-bottom: 36px;
}
.footer-brand .brand { margin-bottom: 14px; }
.footer-brand .brand-mark { background: rgba(255, 255, 255, 0.1); box-shadow: none; }
.footer-brand .brand-kicker { color: rgba(255, 255, 255, 0.55); }
.footer-brand .brand-name { color: #fff; }
.footer-about {
  margin: 0 0 18px;
  font-size: 12.5px;
  line-height: 1.65;
  color: rgba(255, 255, 255, 0.68);
  max-width: 340px;
}
.footer-social { display: flex; gap: 8px; }
.social-link {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  display: grid;
  place-items: center;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: rgba(255, 255, 255, 0.75);
  text-decoration: none;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.social-link:hover { background: var(--accent); border-color: var(--accent); color: #2b1c04; }

.footer-title {
  margin: 0 0 14px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
.footer-links { list-style: none; margin: 0; padding: 0; }
.footer-links li { margin-bottom: 8px; }
.footer-links a {
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.7);
  text-decoration: none;
  transition: color 0.15s, padding-left 0.15s;
}
.footer-links a:hover { color: #fff; padding-left: 3px; }
.contact-list { list-style: none; margin: 0 0 16px; padding: 0; }
.contact-list li {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  margin-bottom: 10px;
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.74);
  line-height: 1.5;
}
.contact-list .ico { margin-top: 2px; color: var(--accent); }
.contact-list a { text-decoration: none; color: inherit; }
.contact-list a:hover { color: #fff; }
.footer-wa { font-size: 12px; padding: 9px 16px; }

.footer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 18px;
  padding-bottom: 22px;
  font-size: 11.5px;
  color: rgba(255, 255, 255, 0.5);
}
.footer-legal { display: flex; gap: 16px; flex-wrap: wrap; }
.footer-legal a { color: rgba(255, 255, 255, 0.58); text-decoration: none; }
.footer-legal a:hover { color: #fff; }
.footer-note { color: rgba(255, 255, 255, 0.62); }

/* ---------- Botón editar / barra de edición ---------- */
.edit-toggle {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 100;
  display: none;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  padding: 12px 19px;
  background: var(--primary);
  color: #fff;
  font-size: 12.5px;
  font-weight: 650;
  cursor: pointer;
  box-shadow: 0 14px 32px rgba(8, 25, 34, 0.34);
  transition: transform 0.16s, background 0.16s;
}
.edit-toggle:hover { transform: translateY(-2px); background: color-mix(in srgb, var(--primary) 82%, #000); }
.edit-toggle .ico { width: 15px; height: 15px; }

.edit-hint {
  position: fixed;
  left: 20px;
  bottom: 20px;
  z-index: 100;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 9px 9px 9px 15px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow: 0 12px 30px rgba(15, 46, 62, 0.16);
  font-size: 12px;
  color: var(--primary);
}
body.edit-mode .edit-hint { display: inline-flex; }
body.edit-mode .edit-toggle { display: none; }
.hint-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 8%, transparent); }
}
.hint-btn {
  border: 0;
  background: var(--primary);
  color: #fff;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 11.5px;
  font-weight: 650;
  cursor: pointer;
}
.hint-btn.ghost { background: #fff; color: var(--muted); border: 1px solid var(--line); }
.hint-btn:hover { filter: brightness(1.05); }

/* Elementos editables en vivo */
body.edit-mode [data-edit] {
  outline: 1px dashed color-mix(in srgb, var(--accent) 78%, transparent);
  outline-offset: 3px;
  border-radius: 4px;
  cursor: text;
  transition: background 0.15s, outline-color 0.15s;
}
body.edit-mode [data-edit]:hover {
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  outline-color: var(--accent);
}
body.edit-mode [data-edit]:focus {
  outline: 2px solid var(--accent);
  background: #fff;
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent);
}
body.edit-mode a[data-edit] { cursor: text; }

/* ---------- Panel del editor ---------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 110;
  background: rgba(6, 20, 28, 0.45);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.scrim.show { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 120;
  width: min(488px, 100%);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: #fff;
  box-shadow: -24px 0 70px rgba(6, 20, 28, 0.24);
  transform: translateX(102%);
  transition: transform 0.28s cubic-bezier(0.3, 0.7, 0.3, 1);
}
.panel.open { transform: none; }
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  background:
    radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 60%),
    var(--primary);
  color: #fff;
}
.panel-kicker {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--accent) 85%, #fff);
}
.panel-head h2 { margin: 2px 0 0; font-size: 18px; font-weight: 750; letter-spacing: -0.02em; }
.icon-btn {
  width: 34px;
  height: 34px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  display: grid;
  place-items: center;
  transition: background 0.15s;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.2); }

.panel-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 9px 12px;
  background: #fafbfc;
  border-bottom: 1px solid var(--line);
}
.panel-tabs button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px 6px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.panel-tabs button:hover { background: color-mix(in srgb, var(--primary) 5%, #fff); color: var(--primary); }
.panel-tabs button.active {
  background: color-mix(in srgb, var(--primary) 9%, #fff);
  color: var(--primary);
  font-weight: 750;
}
.panel-body { flex: 1; overflow-y: auto; padding: 16px 18px 30px; overscroll-behavior: contain; }
.panel-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 16px;
  border-top: 1px solid var(--line);
  background: #fff;
}
.panel-foot-actions { display: flex; gap: 8px; flex: none; }
.autosave-note {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
}
.autosave-note::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #1c8a52;
}
.panel-foot .btn { font-size: 12px; padding: 9px 16px; }

.block {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 13px 3px;
  margin-bottom: 13px;
  background: #fcfdfd;
}
.block > h3 {
  margin: 0 0 11px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--primary);
}
.hint {
  margin: 0 0 12px;
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--muted);
}
.hint b { color: var(--primary); }

.fgroup { margin-bottom: 11px; }
.fgroup > label,
.fgroup > .flabel {
  display: block;
  margin-bottom: 5px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--muted);
}
.fgroup input[type="text"],
.fgroup input[type="url"],
.fgroup input[type="email"],
.fgroup input[type="number"],
.fgroup input[type="tel"],
.fgroup textarea,
.fgroup select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 8px 10px;
  font-size: 12.5px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.fgroup textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
.fgroup input:focus,
.fgroup textarea:focus,
.fgroup select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.f3 { display: grid; grid-template-columns: 46px 1fr; gap: 9px; }
.f-inline { display: flex; align-items: center; gap: 9px; }
.f-inline input[type="range"] { flex: 1; accent-color: var(--primary); }
.range-val {
  min-width: 42px;
  text-align: right;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--primary);
}
.check-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 0;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
}
.check-row input { width: 16px; height: 16px; accent-color: var(--primary); }

.color-row { display: flex; align-items: center; gap: 10px; }
.color-row input[type="color"] {
  width: 40px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 2px;
  cursor: pointer;
  flex: none;
}
.color-row .color-hex { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, "Cascadia Mono", monospace; }

.preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 12px; }
.preset {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 7px 6px;
  cursor: pointer;
  font-size: 10.5px;
  font-weight: 650;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.preset:hover { border-color: var(--accent); }
.preset .swatches { display: inline-flex; }
.preset .swatches i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.preset .swatches i + i { margin-left: -2px; }

.row-card {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  padding: 11px;
  margin-bottom: 9px;
}
.row-card .row-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--primary);
}
.row-card .row-head .row-num {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--primary) 7%, #fff);
  display: grid;
  place-items: center;
  font-size: 10px;
  color: var(--muted);
  flex: none;
}
.row-card .row-head .row-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-actions { display: flex; justify-content: flex-end; gap: 5px; margin-top: 8px; }
.mini-btn {
  width: 27px;
  height: 27px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.mini-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: #f7fafb; }
.mini-btn:disabled { opacity: 0.35; cursor: default; }
.mini-btn.danger:hover { border-color: var(--hot); color: var(--hot); background: #fff5f5; }
.add-btn {
  width: 100%;
  border: 1.5px dashed color-mix(in srgb, var(--primary) 26%, #fff);
  border-radius: 9px;
  background: transparent;
  padding: 9px;
  color: var(--primary);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 12px;
  transition: border-color 0.15s, background 0.15s;
}
.add-btn:hover { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 4%, #fff); }

.logo-editor { display: flex; gap: 12px; align-items: center; margin-bottom: 11px; }
.logo-preview {
  width: 56px;
  height: 56px;
  border-radius: 13px;
  background: var(--primary);
  display: grid;
  place-items: center;
  overflow: hidden;
  flex: none;
  color: #fff;
  font-size: 26px;
}
.logo-preview img { width: 100%; height: 100%; object-fit: cover; }
.logo-preview svg { width: 38px; height: 38px; }
.logo-tools { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.file-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 10px;
  background: #fff;
  color: var(--primary);
  font-size: 11px;
  font-weight: 650;
  cursor: pointer;
}
.file-btn:hover { border-color: var(--primary); }
.file-btn input { display: none; }

details.prod-row {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  margin-bottom: 8px;
  overflow: hidden;
}
details.prod-row[open] { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
details.prod-row summary {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  cursor: pointer;
  list-style: none;
  font-size: 11.5px;
  font-weight: 650;
  color: var(--primary);
}
details.prod-row summary::-webkit-details-marker { display: none; }
details.prod-row summary .chev { margin-left: auto; color: var(--muted); font-size: 10px; transition: transform 0.15s; }
details.prod-row[open] summary .chev { transform: rotate(90deg); }
.prod-thumb {
  width: 32px;
  height: 32px;
  border-radius: 7px;
  background: #f1f5f7;
  display: grid;
  place-items: center;
  font-size: 17px;
  overflow: hidden;
  flex: none;
}
.prod-thumb img { width: 100%; height: 100%; object-fit: cover; }
.prod-row-body { padding: 11px; border-top: 1px solid var(--line); }

.image-preview {
  width: 100%;
  height: 96px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  margin-bottom: 8px;
  display: grid;
  place-items: center;
  background: #f7fafb;
  overflow: hidden;
  color: var(--muted);
  font-size: 22px;
}
.image-preview img { width: 100%; height: 100%; object-fit: contain; }

.data-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.data-stat {
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  padding: 9px 10px;
}
.data-stat b { display: block; font-size: 17px; color: var(--primary); letter-spacing: -0.02em; }
.data-stat span { font-size: 10px; color: var(--muted); }
.data-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.data-actions .btn { font-size: 11px; padding: 9px 10px; }
.data-actions .wide { grid-column: 1 / -1; }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  z-index: 200;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  background: #10242e;
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.26);
  transition: opacity 0.2s, transform 0.2s;
  max-width: calc(100% - 32px);
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

body.panel-open { overflow: hidden; }

/* ---------- Responsive ---------- */
@media (max-width: 1120px) {
  .product-grid { grid-template-columns: repeat(3, 1fr); }
  .header-inner { gap: 18px; }
  .phone-link span { display: none; }
  .footer-grid { grid-template-columns: 1.4fr 1fr 1fr; }
  .footer-grid > :last-child { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 40px; align-items: flex-start; }
  .footer-grid > :last-child .footer-title { width: 100%; margin-bottom: 2px; }
  .footer-grid > :last-child .contact-list { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 28px; }
  .footer-grid > :last-child .footer-wa { margin-left: 0; }
}

@media (max-width: 960px) {
  .cat-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 900px) {
  .header-inner { flex-wrap: wrap; padding: 12px 0 14px; }
  .brand { order: 1; }
  .header-actions { order: 2; margin-left: auto; }
  .searchbar { order: 3; flex-basis: 100%; max-width: none; margin: 4px 0 0; }
  .nav-badge { display: none; }
  .promo { flex-direction: column; align-items: flex-start; padding: 24px; gap: 18px; }
  .promo p { font-size: 13px; }
  .popular { padding: 18px; }
  .chip-grid { grid-template-columns: repeat(3, 1fr); }
  .product-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 720px) {
  .container { width: calc(100% - 28px); }
  .topbar-msg { font-size: 11px; }
  .topbar-right { display: none; }
  .topbar-inner { justify-content: center; }
  .cat-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 26px; }
  .footer-brand { grid-column: 1 / -1; }
  .footer-grid > :last-child { grid-column: 1 / -1; }
  .page-stats { display: none; }
  .section-head { align-items: flex-start; }
  .edit-hint { left: 12px; right: 12px; bottom: 12px; border-radius: 14px; padding: 9px 10px 9px 13px; }
  .hint-text { font-size: 10.5px; }
  .hint-btn { padding: 7px 11px; font-size: 10.5px; }
  .edit-toggle { right: 12px; bottom: 12px; }
  section[id], footer[id] { scroll-margin-top: 175px; }
}

@media (max-width: 560px) {
  .brand-name { font-size: 18px; }
  .brand-mark { width: 42px; height: 42px; border-radius: 12px; }
  .brand-mark svg { width: 30px; height: 30px; }
  .brand-kicker { font-size: 8.5px; }
  .btn-accent.header-cta span { display: none; }
  .btn-accent.header-cta { padding: 11px 13px; }
  .search-btn span { display: none; }
  .search-btn { padding: 10px 13px; }
  .searchbar select { max-width: 108px; font-size: 11px; padding-left: 10px; }
  .product-grid { grid-template-columns: 1fr; }
  .chip-grid { grid-template-columns: repeat(2, 1fr); }
  .footer-grid { grid-template-columns: 1fr; }
  .footer-brand { grid-column: auto; }
  .footer-bottom { flex-direction: column; align-items: flex-start; }
  .cat-card { padding: 15px; }
  .page-title { font-size: 26px; }
  .f2 { grid-template-columns: 1fr; }
  .preset-grid { grid-template-columns: 1fr 1fr; }
}

</style>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <div style="max-width:640px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif;color:#17272f">
      <h1>Comercial Faro Sur</h1>
      <p>Esta página necesita JavaScript activado para mostrar el catálogo y el editor.</p>
    </div>
  </noscript>

  <button id="editToggle" class="edit-toggle" type="button" style="display:none">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>

  /* ---------- Persistencia ---------- */
  var saveTimer = null;
  var pageTimer = null;
  var toastTimer = null;

  function saveNow() {
    clearTimeout(saveTimer);
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(cfg));
    } catch (err) {
      toast('No se pudo guardar en el navegador. Descarga tu configuración.');
    }
    try {
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) })
          .then(function (r) { return r.json(); })
          .then(function (d) { if (d && d.ok) { console.log('index.html actualizado'); try { toast('Archivo index.html actualizado'); } catch (e) {} } else { try { toast('Error al guardar archivo: ' + ((d && d.error) || '')); } catch (e) {} } })
          .catch(function () { try { toast('No se pudo guardar en archivo (servidor?)'); } catch (e) {} });
      }
    } catch (e) { /* noop */ }
  }
  function queueSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 250);
  }
  function queuePageRender() {
    clearTimeout(pageTimer);
    pageTimer = setTimeout(renderPage, 90);
  }
  function toast(msg) {
    var t = $('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2300);
  }

  /* ---------- Datos derivados ---------- */
  function telHref() {
    return 'tel:' + String((cfg.business && cfg.business.phone) || '').replace(/[^\d+]/g, '');
  }

  function waHref(productName) {
    var digits = String((cfg.business && cfg.business.whatsapp) || '').replace(/\D/g, '');
    var tpl = productName ? cfg.texts.productMessage : cfg.texts.whatsappMessage;
    var msg = String(tpl || '').replace(/\{producto\}/g, productName || '');
    if (!digits) return '#contacto';
    return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(msg);
  }

  function filteredProducts() {
    var term = ui.term.toLowerCase().trim();
    return (cfg.products || []).filter(function (p) {
      var inCat = !ui.category || p.category === ui.category;
      var hay = [p.name, p.category, p.badge, p.emoji].join(' ').toLowerCase();
      var inTerm = !term || hay.indexOf(term) !== -1;
      return inCat && inTerm;
    });
  }

  function badgeClass(badge) {
    var s = String(badge || '').toLowerCase();
    if (s.indexOf('oferta') !== -1 || s.indexOf('sale') !== -1 || s.indexOf('%') !== -1) return 'is-offer';
    if (s.indexOf('nuevo') !== -1 || s.indexOf('new') !== -1) return 'is-new';
    return 'is-top';
  }

  /* ---------- Render de la página ---------- */
  function applyTheme() {
    var t = cfg.theme || {};
    var r = document.documentElement.style;
    ['primary', 'accent', 'hot', 'bg'].forEach(function (k) {
      if (t[k]) r.setProperty('--' + k, t[k]);
    });
    r.setProperty('--radius', (Number(t.radius) || 0) + 'px');
    if (t.font) r.setProperty('--font', t.font);
    document.body.classList.toggle('no-sticky', !t.stickyHeader);
    document.body.classList.toggle('no-shadow', !t.shadows);
  }

  /* ---------- Editor: helpers de formulario ---------- */
  function fText(label, path, value, attrs) {
    return '<div class="fgroup"><label>' + esc(label) + '</label><input type="text" data-field="' + esc(path) + '" value="' + esc(value) + '" ' + (attrs || '') + '></div>';
  }
  function fArea(label, path, value, rows) {
    return '<div class="fgroup"><label>' + esc(label) + '</label><textarea data-field="' + esc(path) + '" rows="' + (rows || 3) + '">' + esc(value) + '</textarea></div>';
  }
  function fColor(label, path, value) {
    return '<div class="fgroup"><span class="flabel">' + esc(label) + '</span><div class="color-row"><input type="color" data-field="' + esc(path) + '" value="' + esc(value) + '"><span class="color-hex">' + esc(value) + '</span></div></div>';
  }
  function fCheck(label, path, checked) {
    return '<label class="check-row"><input type="checkbox" data-field="' + esc(path) + '"' + (checked ? ' checked' : '') + '> ' + esc(label) + '</label>';
  }
  function fRange(label, path, value, min, max) {
    return '<div class="fgroup"><label>' + esc(label) + '</label><div class="f-inline"><input type="range" min="' + min + '" max="' + max + '" step="1" data-field="' + esc(path) + '" value="' + esc(value) + '"><span class="range-val">' + esc(value) + ' px</span></div></div>';
  }
  function fSelect(label, path, value, options) {
    return '<div class="fgroup"><label>' + esc(label) + '</label><select data-field="' + esc(path) + '">' +
      options.map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === value ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join('') + '</select></div>';
  }
  function rowActions(arrPath, i, len) {
    return '<div class="row-actions">' +
      '<button class="mini-btn" type="button" data-move="' + esc(arrPath) + '" data-index="' + i + '" data-dir="-1" title="Subir"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
      '<button class="mini-btn" type="button" data-move="' + esc(arrPath) + '" data-index="' + i + '" data-dir="1" title="Bajar"' + (i === len - 1 ? ' disabled' : '') + '>↓</button>' +
      '<button class="mini-btn danger" type="button" data-del="' + esc(arrPath) + '" data-index="' + i + '" title="Eliminar">✕</button>' +
      '</div>';
  }

  function addItem(path) {
    var arr = getPath(cfg, path);
    var item = blankFor(path);
    if (!Array.isArray(arr) || !item) return;
    arr.push(item);
    saveNow();
    renderPage();
    renderPanel();
    requestAnimationFrame(function () {
      var body = $('#panelBody');
      if (!body) return;
      if (path === 'products') {
        var all = $$('details.prod-row', body);
        var last = all[all.length - 1];
        if (last) {
          last.open = true;
          last.scrollIntoView({ block: 'nearest' });
        }
      } else {
        body.scrollTop = body.scrollHeight;
      }
    });
    toast('Elemento agregado');
  }

  function removeItem(path, index) {
    var arr = getPath(cfg, path);
    if (!Array.isArray(arr) || !arr[index]) return;
    arr.splice(index, 1);
    saveNow();
    renderPage();
    renderPanel();
    toast('Elemento eliminado');
  }

  function moveItem(path, index, dir) {
    var arr = getPath(cfg, path);
    if (!Array.isArray(arr)) return;
    var j = index + dir;
    if (j < 0 || j >= arr.length) return;
    var tmp = arr[index];
    arr[index] = arr[j];
    arr[j] = tmp;
    saveNow();
    renderPage();
    renderPanel(true);
  }

  /* ---------- Editor: archivos ---------- */
  function readAndResize(file, maxW, maxH) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var dataUrl = reader.result;
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxW / img.width, maxH / img.height);
          if (scale >= 1 && dataUrl.length < 180000) {
            resolve(dataUrl);
            return;
          }
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var type = /png|svg/i.test(file.type) ? 'image/png' : 'image/jpeg';
          try {
            resolve(canvas.toDataURL(type, 0.86));
          } catch (err) {
            resolve(dataUrl);
          }
        };
        img.onerror = function () { reject(new Error('imagen')); };
        img.src = dataUrl;
      };
      reader.onerror = function () { reject(new Error('lectura')); };
      reader.readAsDataURL(file);
    });
  }

  function handleUpload(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var kind = input.dataset.upload;
    var index = parseInt(input.dataset.index, 10);
    readAndResize(file, kind === 'logo' ? 420 : 1000, kind === 'logo' ? 420 : 1000)
      .then(function (dataUrl) {
        if (kind === 'logo') {
          cfg.business.logoImage = dataUrl;
        } else if (kind === 'product' && cfg.products[index]) {
          cfg.products[index].image = dataUrl;
        }
        saveNow();
        renderPage();
        renderPanel(true);
        toast('Imagen actualizada');
      })
      .catch(function () {
        toast('No se pudo leer la imagen');
      });
  }

  /* ---------- Editor: exportar / importar ---------- */
  function download(filename, content, type) {
    type = type || 'application/json';
    // Método 1: selector de carpeta (guarda directamente en la carpeta elegida)
    if (window.showDirectoryPicker) {
      window.showDirectoryPicker().then(function (dirHandle) {
        return dirHandle.getFileHandle(filename, { create: true }).then(function (fileHandle) {
          return fileHandle.createWritable().then(function (writable) {
            return writable.write(content).then(function () {
              return writable.close();
            });
          });
        });
      }).then(function () {
        toast('✅ ' + filename + ' guardado en la carpeta que elegiste');
      }).catch(function (err) {
        if (err && err.name !== 'AbortError') {
          downloadFilePicker(filename, content, type);
        }
      });
      return true;
    }
    return downloadFilePicker(filename, content, type);
  }

  function downloadFilePicker(filename, content, type) {
    type = type || 'application/json';
    // Método 2: selector de archivo (permite elegir la carpeta)
    if (window.showSaveFilePicker) {
      var opts = {
        suggestedName: filename,
        types: [{ description: 'Archivo JavaScript', accept: { 'text/javascript': ['.js'] } }]
      };
      if (filename.indexOf('.json') > -1) opts.types = [{ description: 'Archivo JSON', accept: { 'application/json': ['.json'] } }];
      window.showSaveFilePicker(opts).then(function (handle) {
        return handle.createWritable().then(function (writable) {
          return writable.write(content).then(function () {
            return writable.close();
          });
        });
      }).then(function () {
        toast('✅ Archivo guardado: ' + filename);
      }).catch(function (err) {
        if (err && err.name !== 'AbortError') {
          fallbackDownload(filename, content, type);
        }
      });
      return true;
    }
    return fallbackDownload(filename, content, type);
  }

  function fallbackDownload(filename, content, type) {
    type = type || 'application/json';
    try {
      var blob = new Blob([content], { type: type });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (err) {
      try {
        var dataUrl = 'data:' + type + ';charset=utf-8,' + encodeURIComponent(content);
        var a2 = document.createElement('a');
        a2.href = dataUrl;
        a2.download = filename;
        a2.style.display = 'none';
        document.body.appendChild(a2);
        a2.click();
        setTimeout(function () { a2.remove(); }, 2000);
        return true;
      } catch (err2) {
        return false;
      }
    }
  }

  function exportJSON() {
    var now = new Date();
    var ts = now.getFullYear() + '' + String(now.getMonth()+1).padStart(2,'0') + '' + String(now.getDate()).padStart(2,'0') + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
    var filename = 'faro-sur.config_' + ts + '.json';
    var ok = download(filename, JSON.stringify(cfg, null, 2), 'application/json');
    if (ok) toast('Archivo guardado: ' + filename);
    else toast('No se pudo descargar. Usa "Copiar JSON" y guárdalo manualmente.');
  }

  function exportJS() {
    var content = '/* Configuración de Comercial Faro Sur · generada desde el editor */\n' +
      'window.FARO_CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n';
    // Timestamp para nombre único (evita sobrescribir archivo viejo)
    var now = new Date();
    var ts = now.getFullYear() + '' + String(now.getMonth()+1).padStart(2,'0') + '' + String(now.getDate()).padStart(2,'0') + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
    var filename = 'config_' + ts + '.js';
    var ok = download(filename, content, 'text/javascript');
    if (ok) {
      toast('Archivo guardado: ' + filename + '. Renómbralo a config.js en tu carpeta del sitio.');
      // También copiar al portapapeles como respaldo
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(content).then(function() {
            toast('También copiado al portapapeles. Puedes pegarlo en Notepad si el archivo no se guardó.');
          }).catch(function(){});
        }
      } catch(e){}
    } else {
      toast('No se pudo descargar. Usa "Copiar JSON" y guárdalo manualmente.');
    }
  }

  function importConfig(text) {
    var data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      toast('El JSON no es válido');
      return;
    }
    if (!data || !isObj(data.business) || !Array.isArray(data.categories) || !Array.isArray(data.products) ||
        !data.categories.every(isObj) || !data.products.every(isObj)) {
      toast('El archivo no tiene el formato esperado');
      return;
    }
    cfg = merge(DEFAULTS, data);
    ui.term = '';
    ui.category = '';
    saveNow();
    renderPage();
    renderPanel();
    toast('Configuración importada');
  }

  function resetConfig() {
    if (!window.confirm('¿Restaurar el contenido de fábrica? Se perderán los cambios guardados en este navegador.')) return;
    cfg = merge(DEFAULTS, {});
    ui.term = '';
    ui.category = '';
    saveNow();
    renderPage();
    renderPanel();
    toast('Contenido restaurado');
  }

  function copyConfig() {
    var text = JSON.stringify(cfg, null, 2);
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) { /* noop */ }
      ta.remove();
      toast('Configuración copiada');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('Configuración copiada');
      }).catch(fallback);
    } else {
      fallback();
    }
  }

  /* ---------- Editor: panel ---------- */
  function setPanel(open) {
    ui.panel = open;
    var panel = $('#panel');
    var scrim = $('#scrim');
    if (!panel || !scrim) return;
    panel.classList.toggle('open', open);
    panel.setAttribute('aria-hidden', String(!open));
    if (open) panel.removeAttribute('inert');
    else panel.setAttribute('inert', '');
    scrim.classList.toggle('show', open);
    document.body.classList.toggle('panel-open', open);
    if (open) {
      ui.edit = true;
      renderPage();
      renderPanel();
    } else {
      saveNow();
    }
  }

  function handleFieldInput(el) {
    if (el.matches('[data-searches]')) {
      cfg.popularSearches = el.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      queueSave();
      queuePageRender();
      return;
    }
    if (el.matches('[data-commas]')) {
      var items = el.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      setPath(cfg, el.dataset.commas, items);
      queueSave();
      queuePageRender();
      return;
    }
    if (!el.matches('[data-field]')) return;
    var val;
    if (el.type === 'checkbox') val = el.checked;
    else if (el.type === 'range' || el.type === 'number' || el.dataset.number !== undefined) val = Number(el.value);
    else val = el.value;

    setPath(cfg, el.dataset.field, val);

    if (el.type === 'color') {
      var hex = el.parentElement.querySelector('.color-hex');
      if (hex) hex.textContent = el.value;
    }
    if (el.type === 'range') {
      var wrap = el.closest('.f-inline');
      var out = wrap && wrap.querySelector('.range-val');
      if (out) out.textContent = el.value + ' px';
    }
    queueSave();
    queuePageRender();
  }

  /* ---------- Eventos ---------- */
  function onDocumentClick(e) {
    var openBtn = e.target.closest('[data-open-panel]');
    if (openBtn) {
      setPanel(true);
      return;
    }
    var exitBtn = e.target.closest('[data-exit-edit]');
    if (exitBtn) {
      ui.edit = false;
      setPanel(false);
      renderPage();
      saveNow();
      toast('Edición desactivada');
      return;
    }
    if (e.target.closest('[data-panel-close]')) {
      setPanel(false);
      return;
    }
    if (e.target.closest('[data-export-json]')) {
      exportJSON();
      return;
    }

    if (ui.edit) {
      var anchor = e.target.closest('a');
      if (anchor) e.preventDefault();
      return;
    }

    var clear = e.target.closest('[data-clear-filter]');
    if (clear) {
      ui.term = '';
      ui.category = '';
      renderPage();
      return;
    }

    var catBtn = e.target.closest('[data-filter-cat]');
    if (catBtn) {
      e.preventDefault();
      ui.category = catBtn.dataset.filterCat;
      ui.term = '';
      renderPage();
      scrollToProducts();
      return;
    }

    var termBtn = e.target.closest('[data-search-term]');
    if (termBtn) {
      e.preventDefault();
      ui.term = termBtn.dataset.searchTerm;
      ui.category = '';
      renderPage();
      scrollToProducts();
    }
  }

  function onInlineBlur(e) {
    var el = e.target.closest ? e.target.closest('[data-edit]') : null;
    if (!el || !ui.edit) return;
    var path = el.dataset.edit;
    var val = (el.innerText || '').replace(/\s+/g, ' ').trim();
    var old = String(getPath(cfg, path) == null ? '' : getPath(cfg, path));
    if (val === old) return;
    if (!val) {
      el.innerText = old;
      return;
    }
    setPath(cfg, path, val);
    saveNow();
    renderPage();
    toast('Texto actualizado');
  }

  function onSearchSubmit(e) {
    if (!e.target || e.target.id !== 'searchForm') return;
    e.preventDefault();
    var input = $('#searchInput');
    var select = $('#searchCategory');
    ui.term = input ? input.value.trim() : '';
    ui.category = select ? select.value : '';
    renderPage();
    scrollToProducts();
  }

  function onPanelInput(e) {
    var el = e.target;
    if (!el || !el.matches) return;
    if (el.matches('[data-field],[data-searches],[data-commas]')) handleFieldInput(el);
  }

  function onPanelChange(e) {
    var el = e.target;
    if (!el || !el.matches) return;
    if (el.matches('select[data-field], input[type="checkbox"][data-field]')) handleFieldInput(el);
    if (el.matches('input[type="file"]')) {
      if (el.dataset.upload) handleUpload(el);
      else if (el.dataset.import) {
        var file = el.files && el.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () { importConfig(String(reader.result || '')); };
        reader.onerror = function () { toast('No se pudo leer el archivo'); };
        reader.readAsText(file);
      }
    }
  }

  function onPanelClick(e) {
    var tab = e.target.closest('[data-tab]');
    if (tab) {
      ui.tab = tab.dataset.tab;
      renderPanel();
      return;
    }
    var add = e.target.closest('[data-add]');
    if (add) {
      addItem(add.dataset.add);
      return;
    }
    var del = e.target.closest('[data-del]');
    if (del) {
      removeItem(del.dataset.del, parseInt(del.dataset.index, 10));
      return;
    }
    var mv = e.target.closest('[data-move]');
    if (mv) {
      moveItem(mv.dataset.move, parseInt(mv.dataset.index, 10), parseInt(mv.dataset.dir, 10));
      return;
    }
    var preset = e.target.closest('[data-preset]');
    if (preset) {
      var p = PRESETS[preset.dataset.preset];
      if (p) {
        cfg.theme.primary = p.primary;
        cfg.theme.accent = p.accent;
        cfg.theme.hot = p.hot;
        cfg.theme.bg = p.bg;
        saveNow();
        renderPage();
        renderPanel(true);
        toast('Paleta aplicada');
      }
      return;
    }
    var cmd = e.target.closest('[data-cmd]');
    if (!cmd) return;
    var action = cmd.dataset.cmd;
    if (action === 'clear-logo') {
      cfg.business.logoImage = '';
      saveNow();
      renderPage();
      renderPanel(true);
    } else if (action === 'clear-product-image') {
      var idx = parseInt(cmd.dataset.index, 10);
      if (cfg.products[idx]) cfg.products[idx].image = '';
      saveNow();
      renderPage();
      renderPanel(true);
    } else if (action === 'export-json') {
      exportJSON();
    } else if (action === 'export-js') {
      exportJS();
    } else if (action === 'copy-json') {
      copyConfig();
    } else if (action === 'import-text') {
      var ta = $('#importText');
      if (ta && ta.value.trim()) importConfig(ta.value.trim());
      else toast('Pega primero un JSON');
    } else if (action === 'reset') {
      resetConfig();
    }
  }

  function bindEvents() {
    var editToggle = $('#editToggle');
    if (editToggle) {
      editToggle.addEventListener('click', function () {
        setPanel(true);
        toast('Editor abierto · haz clic en los textos para cambiarlos');
      });
    }

    var scrim = $('#scrim');
    if (scrim) scrim.addEventListener('click', function () { setPanel(false); });

    var panel = $('#panel');
    if (panel) {
      panel.addEventListener('click', onPanelClick);
      panel.addEventListener('input', onPanelInput);
      panel.addEventListener('change', onPanelChange);
    }

    document.addEventListener('click', onDocumentClick);
    document.addEventListener('focusout', onInlineBlur);
    document.addEventListener('submit', onSearchSubmit);

    document.addEventListener('paste', function (e) {
      if (!e.target.closest || !e.target.closest('[data-edit]')) return;
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && ui.panel) setPanel(false);
    });

    window.addEventListener('beforeunload', saveNow);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') saveNow();
    });
  }

  /* ---------- Inicio ---------- */
  renderPage();
  bindEvents();

  var params;
  try { params = new URLSearchParams(window.location.search); } catch (err) { params = null; }
  // Solo permitir edición en entorno local (file:// o localhost) O con clave de admin
  var isLocal = (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '');
  var adminKey = (cfg.business && cfg.business.adminKey) ? String(cfg.business.adminKey).trim() : '';
  var urlAdmin = params ? (params.get('admin') || '') : '';
  var hasAdminAccess = adminKey && urlAdmin && urlAdmin === adminKey;
  var editMode = (isLocal && params && /^(1|true|si|sí|on)$/i.test(params.get('editar') || '')) || hasAdminAccess;
  // Ocultar botón de edición al público; solo visible con acceso de admin
  var editToggle = $('#editToggle');
  var editHint = $('#editHint');
  if (editMode) {
    if (editToggle) editToggle.style.display = 'inline-flex';
    if (editHint) editHint.style.display = 'flex';
    setPanel(true);
  } else {
    if (editToggle) editToggle.style.display = 'none';
    if (editHint) editHint.style.display = 'none';
    // Triple clic en el logo para pedir contraseña de admin
    var logoEl = document.querySelector('.brand');
    if (logoEl && adminKey) {
      var clickCount = 0;
      var clickTimer = null;
      logoEl.addEventListener('click', function (e) {
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(function () { clickCount = 0; }, 800);
        if (clickCount >= 3) {
          clickCount = 0;
          var pass = prompt('Clave de administrador:');
          if (pass && pass.trim() === adminKey) {
            if (editToggle) editToggle.style.display = 'inline-flex';
            if (editHint) editHint.style.display = 'flex';
            setPanel(true);
            toast('Modo edición activado');
          } else if (pass !== null) {
            toast('Clave incorrecta');
          }
        }
      });
    }
  }
})();

</script>

  <script>
  // === SOLO ADMINISTRADOR ===
  // Cambia esta clave por la tuya antes de subir a GitHub
  const CLAVE_ADMIN = "faro1234";
  const editBtn = document.getElementById('editToggle');
  const editHint = document.getElementById('editHint');

  function esAdmin(){ return sessionStorage.getItem('soyAdmin') === 'si'; }
  function mostrarBotonAdmin(){ if(editBtn) editBtn.style.display=''; }
  function pedirClave(){
    const clave = prompt('Ingresa la clave de administrador:');
    if(clave === CLAVE_ADMIN){
      sessionStorage.setItem('soyAdmin','si');
      mostrarBotonAdmin();
      alert('Modo administrador activado. Ahora ves el botón Editar página.');
    } else if(clave !== null){
      alert('Clave incorrecta.');
    }
  }
  // Si ya eres admin en esta pestaña, mostrar botón
  if(esAdmin()) mostrarBotonAdmin();
  // Entrar como admin: escribe ?admin en la URL. Ej: tupagina.com/?admin
  const params = new URLSearchParams(window.location.search);
  if(params.has('admin')){
    pedirClave();
    // Limpia la URL para que no quede ?admin visible
    history.replaceState({}, '', window.location.pathname);
  }
  // Atajo secreto: Ctrl + Shift + A también pide la clave
  document.addEventListener('keydown', (e)=>{
    if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='a'){ e.preventDefault(); pedirClave(); }
  });
  </script>
